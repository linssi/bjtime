<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>北京时间 · 设备时间对照</title>
<style>
  :root {
    --bg: #f4f6fb;
    --bg-grad: radial-gradient(1200px 600px at 50% -10%, #e8eefc 0%, #f4f6fb 55%);
    --card: #ffffff;
    --card-border: #e6e9f2;
    --text: #1b2330;
    --text-soft: #5b6675;
    --accent: #2f6bff;
    --accent-soft: #eaf0ff;
    --shadow: 0 10px 30px rgba(31, 45, 80, 0.08);
    --good: #1a9d5a;
    --warn: #d97706;
  }
  body.dark {
    --bg: #0e1320;
    --bg-grad: radial-gradient(1200px 600px at 50% -10%, #1a2440 0%, #0e1320 55%);
    --card: #161d2e;
    --card-border: #26304a;
    --text: #eef2fb;
    --text-soft: #9aa6bd;
    --accent: #5b8cff;
    --accent-soft: #1b2742;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    --good: #43c98a;
    --warn: #f0a84b;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    background-image: var(--bg-grad);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    transition: background-color .35s ease, color .35s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: clamp(16px, 4vw, 40px) clamp(12px, 4vw, 32px) 28px;
  }

  header {
    width: 100%;
    max-width: 960px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: clamp(18px, 4vw, 28px);
  }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .logo {
    width: 42px; height: 42px; border-radius: 12px; flex: none;
    background: linear-gradient(135deg, var(--accent), #7aa2ff);
    display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 18px;
    box-shadow: var(--shadow);
  }
  .brand h1 { font-size: clamp(16px, 4vw, 20px); margin: 0; line-height: 1.2; }
  .brand p { margin: 2px 0 0; font-size: 12px; color: var(--text-soft); }

  .theme-toggle {
    flex: none;
    border: 1px solid var(--card-border);
    background: var(--card);
    color: var(--text);
    border-radius: 999px;
    padding: 9px 14px;
    font-size: 14px;
    cursor: pointer;
    display: flex; align-items: center; gap: 8px;
    box-shadow: var(--shadow);
    transition: transform .15s ease, background-color .3s ease;
  }
  .theme-toggle:hover { transform: translateY(-1px); }
  .theme-toggle:active { transform: translateY(0); }

  main {
    width: 100%;
    max-width: 960px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: clamp(12px, 2.5vw, 20px);
  }
  @media (max-width: 640px) {
    main { grid-template-columns: 1fr; }
  }

  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    padding: clamp(16px, 3vw, 24px);
    box-shadow: var(--shadow);
  }
  .card.span-2 { grid-column: 1 / -1; }

  .card .label {
    font-size: 13px; color: var(--text-soft);
    display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

  .time-big {
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    font-size: clamp(34px, 11vw, 64px);
    line-height: 1.05;
    letter-spacing: 1px;
  }
  .time-sec {
    font-size: .5em; color: var(--accent);
    font-weight: 700; margin-left: 4px;
  }
  .sub { margin-top: 8px; color: var(--text-soft); font-size: 14px; }
  .sub b { color: var(--text); font-weight: 600; }

  /* 万年历 */
  .almanac { display: flex; align-items: center; gap: clamp(16px, 4vw, 36px); flex-wrap: wrap; }
  .alm-main {
    display: flex; flex-direction: column; align-items: center; min-width: 104px;
    padding-right: clamp(16px, 4vw, 36px);
    border-right: 1px solid var(--card-border);
  }
  .alm-day {
    font-size: clamp(38px, 11vw, 56px); font-weight: 700; line-height: 1.05;
    color: var(--accent); letter-spacing: 2px;
  }
  .alm-month { font-size: 14px; color: var(--text-soft); margin-top: 6px; }
  .alm-side { flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 9px; }
  .alm-row { font-size: 15px; color: var(--text); }
  .alm-row b { font-weight: 600; }
  .alm-soft { color: var(--text-soft); font-size: 14px; }
  .alm-tags { display: flex; gap: 8px; flex-wrap: wrap; }
  .alm-tag {
    display: inline-block; padding: 3px 11px; border-radius: 999px; font-size: 12px;
    background: var(--accent-soft); color: var(--accent); font-weight: 600;
  }
  .alm-tag.fest { background: rgba(217, 119, 6, .16); color: var(--warn); }
  @media (max-width: 640px) {
    .alm-main { border-right: none; padding-right: 0; }
  }

  footer {
    width: 100%; max-width: 960px; margin-top: 22px;
    font-size: 12px; color: var(--text-soft); text-align: center; line-height: 1.7;
  }
  footer b { color: var(--text); }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo">京</div>
      <div>
        <h1>北京时间 · 设备时间对照</h1>
        <p>UTC+8 东八区 · 精确到秒 · 多端自适应</p>
      </div>
    </div>
    <button class="theme-toggle" id="themeBtn" aria-label="切换日夜间模式">
      <span id="themeIcon">🌙</span><span id="themeText">夜间</span>
    </button>
  </header>

  <main>
    <!-- 北京时间 -->
    <section class="card">
      <div class="label"><span class="dot"></span>北京时间（UTC+8）</div>
      <div class="time-big" id="bjTime">--:--<span class="time-sec" id="bjSec">:--</span></div>
      <div class="sub" id="bjDate">加载中…</div>
    </section>

    <!-- 设备时间 -->
    <section class="card">
      <div class="label"><span class="dot"></span>当前设备时间</div>
      <div class="time-big" id="devTime">--:--<span class="time-sec" id="devSec">:--</span></div>
      <div class="sub" id="devDate">加载中…</div>
    </section>

    <!-- 万年历 -->
    <section class="card span-2">
      <div class="label"><span class="dot"></span>万年历 · 农历</div>
      <div class="almanac">
        <div class="alm-main">
          <div class="alm-day" id="almDay">--</div>
          <div class="alm-month" id="almMonth">加载中…</div>
        </div>
        <div class="alm-side">
          <div class="alm-row" id="almGanzhi">--</div>
          <div class="alm-row alm-soft" id="almSolar">--</div>
          <div class="alm-tags" id="almTags"></div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    北京时间默认自动联网校准（每 10 分钟同步并缓存），授时源依次为 timeapi.io → worldtimeapi.org → 淘宝授时，因此不受本机时钟误差影响。<br />
    北京与石家庄均位于东八区，<b>标准时差为 0</b>；若两地显示不同，通常是设备所在时区设置不同所致。
  </footer>

<script>
(function () {
  "use strict";

  // ---- 主题切换 ----
  var themeBtn = document.getElementById("themeBtn");
  var themeIcon = document.getElementById("themeIcon");
  var themeText = document.getElementById("themeText");

  function applyTheme(dark) {
    document.body.classList.toggle("dark", dark);
    themeIcon.textContent = dark ? "☀️" : "🌙";
    themeText.textContent = dark ? "日间" : "夜间";
    try { localStorage.setItem("bjtime-theme", dark ? "dark" : "light"); } catch (e) {}
  }
  var saved = null;
  try { saved = localStorage.getItem("bjtime-theme"); } catch (e) {}
  var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  applyTheme(saved ? saved === "dark" : prefersDark);
  themeBtn.addEventListener("click", function () {
    applyTheme(!document.body.classList.contains("dark"));
  });

  // ---- 时间分解 ----
  var WEEK = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
  function pad(n) { return n < 10 ? "0" + n : "" + n; }

  // 把「绝对时刻(UTC 毫秒)」拆成北京（UTC+8）墙钟；用 UTC 方法，不受设备时区影响
  function bjParts(epochMs) {
    var d = new Date(epochMs + 8 * 3600 * 1000);
    return { H: d.getUTCHours(), M: d.getUTCMinutes(), S: d.getUTCSeconds(),
             Y: d.getUTCFullYear(), Mo: d.getUTCMonth(), D: d.getUTCDate(), W: d.getUTCDay() };
  }
  // 把「绝对时刻」拆成本地墙钟（用于设备时间）
  function localParts(epochMs) {
    var d = new Date(epochMs);
    return { H: d.getHours(), M: d.getMinutes(), S: d.getSeconds(),
             Y: d.getFullYear(), Mo: d.getMonth(), D: d.getDate(), W: d.getDay() };
  }
  function fmtHM(p) { return pad(p.H) + ":" + pad(p.M); }
  function fmtS(p) { return ":" + pad(p.S); }
  function fmtDate(p) { return p.Y + "年" + (p.Mo + 1) + "月" + p.D + "日 · " + WEEK[p.W]; }

  // ---- 网络真实北京时间 ----
  // netBase：联网取到的真实北京时间对应的绝对时刻；syncLocal：取数时本机 Date.now()
  var netBase = null, syncLocal = 0;
  try {
    var cB = localStorage.getItem("bjtime-netbase");
    var cS = localStorage.getItem("bjtime-sync");
    if (cB != null && cS != null) { netBase = Number(cB); syncLocal = Number(cS); }
  } catch (e) {}
  // 当前北京时间绝对时刻：有网络值则按本机流逝时间续算（保持走秒），否则退回本机时钟
  function currentBJEpoch() {
    if (netBase == null) return Date.now();
    return netBase + (Date.now() - syncLocal);
  }

  // ---- DOM ----
  var bjTime = document.getElementById("bjTime");
  var bjSec = document.getElementById("bjSec");
  var bjDate = document.getElementById("bjDate");
  var devTime = document.getElementById("devTime");
  var devSec = document.getElementById("devSec");
  var devDate = document.getElementById("devDate");

  // ================= 万年历：农历 / 干支 / 节气 / 节日 =================
  // 农历数据表（1900-2100）：每位含闰月信息、12 个月大小月、闰月大小
  var lunarInfo = [
    0x04bd8,0x04ae0,0x0a570,0x054d5,0x0d260,0x0d950,0x16554,0x056a0,0x09ad0,0x055d2,//1900-1909
    0x04ae0,0x0a5b6,0x0a4d0,0x0d250,0x1d255,0x0b540,0x0d6a0,0x0ada2,0x095b0,0x14977,//1910-1919
    0x04970,0x0a4b0,0x0b4b5,0x06a50,0x06d40,0x1ab54,0x02b60,0x09570,0x052f2,0x04970,//1920-1929
    0x06566,0x0d4a0,0x0ea50,0x06e95,0x05ad0,0x02b60,0x186e3,0x092e0,0x1c8d7,0x0c950,//1930-1939
    0x0d4a0,0x1d8a6,0x0b550,0x056a0,0x1a5b4,0x025d0,0x092d0,0x0d2b2,0x0a950,0x0b557,//1940-1949
    0x06ca0,0x0b550,0x15355,0x04da0,0x0a5b0,0x14573,0x052b0,0x0a9a8,0x0e950,0x06aa0,//1950-1959
    0x0aea6,0x0ab50,0x04b60,0x0aae4,0x0a570,0x05260,0x0f263,0x0d950,0x05b57,0x056a0,//1960-1969
    0x096d0,0x04dd5,0x04ad0,0x0a4d0,0x0d4d4,0x0d250,0x0d558,0x0b540,0x0b6a0,0x195a6,//1970-1979
    0x095b0,0x049b0,0x0a974,0x0a4b0,0x0b27a,0x06a50,0x06d40,0x0af46,0x0ab60,0x09570,//1980-1989
    0x04af5,0x04970,0x064b0,0x074a3,0x0ea50,0x06b58,0x055c0,0x0ab60,0x096d5,0x092e0,//1990-1999
    0x0c960,0x0d954,0x0d4a0,0x0da50,0x07552,0x056a0,0x0abb7,0x025d0,0x092d0,0x0cab5,//2000-2009
    0x0a950,0x0b4a0,0x0baa4,0x0ad50,0x055d9,0x04ba0,0x0a5b0,0x15176,0x052b0,0x0a930,//2010-2019
    0x07954,0x06aa0,0x0ad50,0x05b52,0x04b60,0x0a6e6,0x0a4e0,0x0d260,0x0ea65,0x0d530,//2020-2029
    0x05aa0,0x076a3,0x096d0,0x04afb,0x04ad0,0x0a4d0,0x1d0b6,0x0d250,0x0d520,0x0dd45,//2030-2039
    0x0b5a0,0x056d0,0x055b2,0x049b0,0x0a577,0x0a4b0,0x0aa50,0x1b255,0x06d20,0x0ada0,//2040-2049
    0x14b63,0x09370,0x049f8,0x04970,0x064b0,0x168a6,0x0ea50,0x06b20,0x1a6c4,0x0aae0,//2050-2059
    0x0a2e0,0x0d2e3,0x0c960,0x0d557,0x0d4a0,0x0da50,0x05d55,0x056a0,0x0a6d0,0x055d4,//2060-2069
    0x052d0,0x0a9b8,0x0a950,0x0b4a0,0x0b6a6,0x0ad50,0x055a0,0x0aba4,0x0a5b0,0x052b0,//2070-2079
    0x0b273,0x06930,0x07337,0x06aa0,0x0ad50,0x14b55,0x04b60,0x0a570,0x054e4,0x0d160,//2080-2089
    0x0e968,0x0d520,0x0daa0,0x16aa6,0x056d0,0x04ae0,0x0a9d4,0x0a2d0,0x0d150,0x0f252,//2090-2099
    0x0d520                                                                          //2100
  ];
  var sTermInfo = [0,21208,42467,63836,85337,107014,128867,150921,173149,195551,218072,240693,263343,285989,308563,331033,353350,375494,397447,419210,440795,462224,483532,504758];
  var Gan = ["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"];
  var Zhi = ["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
  var Animals = ["鼠","牛","虎","兔","龙","蛇","马","羊","猴","鸡","狗","猪"];
  var lMonthName = ["正","二","三","四","五","六","七","八","九","十","冬","腊"];
  var nStr1 = ["日","一","二","三","四","五","六","七","八","九","十"];
  var nStr2 = ["初","十","廿","卅"];
  var solarTerms = ["小寒","大寒","立春","雨水","惊蛰","春分","清明","谷雨","立夏","小满","芒种","夏至","小暑","大暑","立秋","处暑","白露","秋分","寒露","霜降","立冬","小雪","大雪","冬至"];
  var solarFest = {"1-1":"元旦","2-14":"情人节","3-8":"妇女节","3-12":"植树节","4-1":"愚人节","5-1":"劳动节","5-4":"青年节","6-1":"儿童节","7-1":"建党节","8-1":"建军节","9-10":"教师节","10-1":"国庆节","12-25":"圣诞节"};
  var lunarFest = {"1-1":"春节","1-15":"元宵节","2-2":"龙头节","5-5":"端午节","7-7":"七夕节","7-15":"中元节","8-15":"中秋节","9-9":"重阳节","12-8":"腊八节","12-23":"小年"};

  function lLeapMonth(y) { return lunarInfo[y - 1900] & 0xf; }
  function lLeapDays(y) { return lLeapMonth(y) ? ((lunarInfo[y - 1900] & 0x10000) ? 30 : 29) : 0; }
  function lMonthDays(y, m) { return (lunarInfo[y - 1900] & (0x10000 >> m)) ? 30 : 29; }
  function lYearDays(y) {
    var i, sum = 348;
    for (i = 0x8000; i > 0x8; i >>= 1) sum += (lunarInfo[y - 1900] & i) ? 1 : 0;
    return sum + lLeapDays(y);
  }
  // 公历 (y,m,d) -> 农历
  function solar2lunar(y, m, d) {
    var offset = Math.floor((Date.UTC(y, m - 1, d) - Date.UTC(1900, 0, 31)) / 86400000);
    var i, temp = 0;
    for (i = 1900; i < 2101 && offset > 0; i++) { temp = lYearDays(i); offset -= temp; }
    if (offset < 0) { offset += temp; i--; }
    var lYear = i, leap = lLeapMonth(i), isLeap = false;
    for (i = 1; i < 13 && offset > 0; i++) {
      if (leap > 0 && i === leap + 1 && !isLeap) { --i; isLeap = true; temp = lLeapDays(lYear); }
      else { temp = lMonthDays(lYear, i); }
      if (isLeap && i === leap + 1) isLeap = false;
      offset -= temp;
    }
    if (offset === 0 && leap > 0 && i === leap + 1) { if (isLeap) { isLeap = false; } else { isLeap = true; --i; } }
    if (offset < 0) { offset += temp; --i; }
    return { lYear: lYear, lMonth: i, lDay: offset + 1, isLeap: isLeap };
  }
  function cDay(d) {
    switch (d) {
      case 10: return "初十";
      case 20: return "二十";
      case 30: return "三十";
      default: return nStr2[Math.floor(d / 10)] + nStr1[d % 10];
    }
  }
  function getTerm(y, n) {
    var off = new Date((31556925974.7 * (y - 1900) + sTermInfo[n] * 60000) + Date.UTC(1900, 0, 6, 2, 5));
    return off.getUTCDate();
  }
  function termOfDay(y, m, d) {
    var mi = m - 1;
    if (getTerm(y, mi * 2) === d) return solarTerms[mi * 2];
    if (getTerm(y, mi * 2 + 1) === d) return solarTerms[mi * 2 + 1];
    return null;
  }
  function dayGZ(y, m, d) {
    // 1900-01-01 为「甲戌」日，甲戌在 60 甲子中序号 10
    var days = Math.floor((Date.UTC(y, m - 1, d) - Date.UTC(1900, 0, 1)) / 86400000);
    var idx = ((days + 10) % 60 + 60) % 60;
    return Gan[idx % 10] + Zhi[idx % 12];
  }

  var almDay = document.getElementById("almDay");
  var almMonth = document.getElementById("almMonth");
  var almGanzhi = document.getElementById("almGanzhi");
  var almSolar = document.getElementById("almSolar");
  var almTags = document.getElementById("almTags");
  var lastAlmKey = "";

  function updateCalendar(bjEpoch) {
    var bj = bjParts(bjEpoch);
    var y = bj.Y, m = bj.Mo + 1, d = bj.D;
    var key = y + "-" + m + "-" + d;
    if (key === lastAlmKey) return;   // 同一天不重复计算
    lastAlmKey = key;

    var lu = solar2lunar(y, m, d);
    var mName = (lu.isLeap ? "闰" : "") + lMonthName[lu.lMonth - 1] + "月";
    var gzYear = Gan[(lu.lYear - 4) % 10] + Zhi[(lu.lYear - 4) % 12];
    var animal = Animals[(lu.lYear - 4) % 12];

    almDay.textContent = cDay(lu.lDay);
    almMonth.textContent = mName;
    almGanzhi.innerHTML = gzYear + "年 · 属" + animal + " · <b>" + dayGZ(y, m, d) + "日</b>";
    almSolar.textContent = "公历 " + y + "年" + m + "月" + d + "日 · " + WEEK[bj.W];

    // 标签：节气 + 节日
    var tags = [];
    var term = termOfDay(y, m, d);
    if (term) tags.push({ t: term, cls: "" });
    if (solarFest[m + "-" + d]) tags.push({ t: solarFest[m + "-" + d], cls: "fest" });
    if (!lu.isLeap && lunarFest[lu.lMonth + "-" + lu.lDay]) tags.push({ t: lunarFest[lu.lMonth + "-" + lu.lDay], cls: "fest" });
    if (!lu.isLeap && lu.lMonth === 12 && lu.lDay === lMonthDays(lu.lYear, 12)) tags.push({ t: "除夕", cls: "fest" });

    almTags.innerHTML = "";
    for (var i = 0; i < tags.length; i++) {
      var sp = document.createElement("span");
      sp.className = "alm-tag" + (tags[i].cls ? " " + tags[i].cls : "");
      sp.textContent = tags[i].t;
      almTags.appendChild(sp);
    }
    almTags.style.display = tags.length ? "flex" : "none";
  }

  function render() {
    var nowEpoch = Date.now();

    // 设备本地时间
    var dev = localParts(nowEpoch);
    devTime.firstChild.nodeValue = fmtHM(dev);
    devSec.textContent = fmtS(dev);
    var tzName = (Intl.DateTimeFormat().resolvedOptions().timeZone) || "未知";
    devDate.innerHTML = fmtDate(dev) + " · 时区 <b>" + tzName + "</b>";

    // 北京时间：默认使用联网真实时间（自动同步），无网络时退回本机时钟
    var bjEpoch = currentBJEpoch();
    var bj = bjParts(bjEpoch);
    bjTime.firstChild.nodeValue = fmtHM(bj);
    bjSec.textContent = fmtS(bj);
    bjDate.innerHTML = fmtDate(bj) + " · <b>UTC+8</b>";

    // 万年历（农历/节气/节日），按北京日期更新
    updateCalendar(bjEpoch);
  }

  // ---- 联网获取权威北京时间 ----
  // 授时源顺序：timeapi.io（主用）→ worldtimeapi.org（备用）→ 淘宝授时（国内兜底）
  function fetchRealBeijing(cb) {
    var done = false;
    function ok(date, src) { if (!done) { done = true; cb(null, date, src); } }
    function fail() { if (!done) { done = true; cb(new Error("net")); } }

    // 主用：timeapi.io，返回的 dateTime 为上海本地时间，补上 +08:00 再解析为绝对时刻
    function tryTimeapi() {
      fetch("https://timeapi.io/api/time/current/zone?timeZone=Asia/Shanghai")
        .then(function (r) { if (!r.ok) throw new Error("ta"); return r.json(); })
        .then(function (d) {
          var iso = String(d.dateTime);
          if (!/[Zz]$|[+-]\d{2}:?\d{2}$/.test(iso)) iso += "+08:00";
          ok(new Date(iso), "timeapi.io");
        })
        .catch(function () { tryWorldtime(); });
    }
    // 备用：worldtimeapi（unixtime 为标准 UTC 秒，直接转绝对时刻）
    function tryWorldtime() {
      fetch("https://worldtimeapi.org/api/timezone/Asia/Shanghai")
        .then(function (r) { if (!r.ok) throw new Error("wt"); return r.json(); })
        .then(function (d) { ok(new Date(d.unixtime * 1000), "worldtimeapi"); })
        .catch(function () { tryTaobao(); });
    }
    // 第三兜底（国内）：淘宝公开授时接口，返回 data.t 为毫秒级时间戳
    function tryTaobao() {
      fetch("https://api.m.taobao.com/rest/api3.do?api=mtop.common.getTimestamp")
        .then(function (r) { if (!r.ok) throw new Error("tb"); return r.json(); })
        .then(function (d) {
          if (!d || !d.data || !d.data.t) throw new Error("tb-data");
          ok(new Date(Number(d.data.t)), "淘宝授时");
        })
        .catch(function () { fail(); });
    }
    tryTimeapi();
  }

  function applyNetworkTime(realBJ) {
    netBase = realBJ.getTime();
    syncLocal = Date.now();
    try {
      localStorage.setItem("bjtime-netbase", String(netBase));
      localStorage.setItem("bjtime-sync", String(syncLocal));
    } catch (e) {}
    render();
  }

  function syncFromNetwork() {
    fetchRealBeijing(function (err, realBJ) {
      if (err || !realBJ) {
        if (netBase == null) console.warn("无法获取网络时间，已用本机时钟（可能不准）");
        return;
      }
      applyNetworkTime(realBJ);
    });
  }

  // 立即渲染；自动联网同步一次，之后每 10 分钟重新同步
  render();
  syncFromNetwork();
  setInterval(syncFromNetwork, 10 * 60 * 1000);

  function align() {
    var delay = 1000 - (Date.now() % 1000);
    setTimeout(function () {
      render();
      setInterval(render, 1000);
    }, delay);
  }
  align();
})();
</script>
</body>
</html>
